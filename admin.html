<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FFX Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#eef3ff;font:15px system-ui,Arial;padding:18px}.wrap{max-width:1000px;margin:auto}h1{font-size:24px}.card{background:#151f33;border:1px solid #293750;border-radius:14px;padding:16px;margin:14px 0}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #43516a}input,select{background:#0e1728;color:white;width:100%;margin:6px 0 12px}button{cursor:pointer;background:#2463eb;color:white;border:0;margin:4px}button.no{background:#b83245}button.gray{background:#42516a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row span{flex:1;min-width:180px}.muted{color:#aab8d0}.hidden{display:none}.item{border-top:1px solid #334158;padding:12px 0}.status{font-weight:700}.Pending{color:#fbbf24}.Approved{color:#4ade80}.Rejected{color:#fb7185}small{color:#aab8d0}#msg{padding:10px;color:#fbbf24}
</style></head><body><main class="wrap"><h1>FFX TOPUP — Admin Panel</h1><div id="msg"></div>
<section class="card" id="login"><h2>Admin Login</h2><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Login</button></section>
<div id="dashboard" class="hidden"><div class="row"><h2 style="flex:1">Dashboard</h2><button class="gray" id="refresh">Refresh</button><button class="no" id="logout">Logout</button></div>
<section class="card"><h3>Payment Numbers</h3><div class="grid"><div><label>bKash number</label><input id="bkash" placeholder="01XXXXXXXXX"></div><div><label>Nagad number</label><input id="nagad" placeholder="01XXXXXXXXX"></div></div><button id="saveSettings">Save Numbers</button></section>
<section class="card"><h3>Deposit Requests</h3><div id="deposits">Loading...</div></section></div></main>
<script>
const $=id=>document.getElementById(id);async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(t){$('msg').textContent=t}
async function load(){const d=await api('/api/admin/settings');$('bkash').value=d.bkash_number||'';$('nagad').value=d.nagad_number||'';const x=await api('/api/admin/deposits');$('deposits').innerHTML='';if(!x.deposits.length){$('deposits').textContent='কোনো আবেদন নেই';return}x.deposits.forEach(d=>{const el=document.createElement('div');el.className='item';const h=document.createElement('div');const title=document.createElement('b');title.textContent=`#${d.id} — ৳${Number(d.amount).toFixed(2)}`;const status=document.createElement('span');status.className='status '+d.status;status.textContent=' · '+d.status;const detail=document.createElement('small');detail.textContent=`${d.name} (${d.email}) · ${d.method} · Sender: ${d.sender_number} · TrxID: ${d.trxid}`;const when=document.createElement('small');when.textContent=new Date(d.created_at).toLocaleString();h.append(title,status,document.createElement('br'),detail,document.createElement('br'),when);el.appendChild(h);if(d.status==='Pending'){const row=document.createElement('div');row.className='row';const note=document.createElement('input');note.placeholder='Admin note (optional)';note.style.flex='1';const yes=document.createElement('button');yes.textContent='Approve';yes.onclick=()=>review(d.id,'Approved',note.value);const no=document.createElement('button');no.textContent='Reject';no.className='no';no.onclick=()=>review(d.id,'Rejected',note.value);row.append(note,yes,no);el.appendChild(row)}$('deposits').appendChild(el)})}
async function review(id,status,note){if(!confirm(status==='Approved'?'পেমেন্ট যাচাই করে নিশ্চিতভাবে টাকা পেয়েছ? Approve করবে?':'এই আবেদন Reject করবে?'))return;try{await api(`/api/admin/deposits/${id}/review`,{method:'POST',body:JSON.stringify({status,note})});msg('আবেদন আপডেট হয়েছে');await load()}catch(e){msg(e.message)}}
async function show(){try{const d=await api('/api/admin/me');if(d.isAdmin){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}}catch(e){msg(e.message)}}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});$('password').value='';msg('Login successful');await show()}catch(e){msg(e.message)}};
$('saveSettings').onclick=async()=>{try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({bkash_number:$('bkash').value,nagad_number:$('nagad').value})});msg('Payment numbers saved')}catch(e){msg(e.message)}};
$('refresh').onclick=()=>load().catch(e=>msg(e.message));$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};show().catch(e=>msg(e.message));
</script></body></html>
